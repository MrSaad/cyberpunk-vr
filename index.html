<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Cyberpunk VR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07040d; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #overlay {
        position: fixed; left: 16px; bottom: 16px; max-width: 360px;
        color: #e9e3ff; background: rgba(10, 4, 22, 0.78); border: 1px solid #ff2a6d;
        box-shadow: 0 0 18px rgba(255, 42, 109, 0.35); padding: 12px 14px; font-size: 13px; line-height: 1.45;
        border-radius: 6px; pointer-events: none;
      }
      #overlay h1 { margin: 0 0 6px; font-size: 15px; color: #fcee0a; letter-spacing: 0.08em; }
      #overlay kbd { background: #2a1440; border: 1px solid #5a2a80; border-radius: 3px; padding: 0 4px; font-size: 12px; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #00f0ff; font-size: 18px; letter-spacing: 0.3em; background: #07040d; z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="loading">BOOTING NIGHT CITY…</div>
    <div id="overlay">
      <h1>CYBERPUNK VR</h1>
      <div><b>VR:</b> press <i>Enter VR</i>. Left stick moves, right stick turns, click left stick to sprint, <kbd>B</kbd> toggles snap turn.</div>
      <div><b>Desktop:</b> click to look, <kbd>WASD</kbd> move, <kbd>Shift</kbd> sprint, <kbd>1</kbd>–<kbd>6</kbd> jump to a station.</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
